name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Required native capabilities may skip on constrained developer hosts,
      # but a release runner must exercise them. See docs/oracle-contract.md.
      WHICHWHY_REQUIRE_ORACLES: '1'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests including native process-policy oracles
        run: go test ./... -count=1
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/whichwhy
      - name: PowerShell 5.1 oracle
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-powershell-oracle.ps1 -ExecutablePath .\whichwhy.exe -ExpectedMajor 5
      - name: PowerShell 7 oracle
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-powershell-oracle.ps1 -ExecutablePath .\whichwhy.exe -ExpectedMajor 7
